[project]
name = "polymarket-research"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.1",
    "duckdb>=1.5.2",
    "google-cloud-bigquery>=3.42.1",
    "gql[requests]>=4.0.0",
    "httpx>=0.28.1",
    "pandas>=3.0.2",
    "pandera>=0.32.1",
    "polars>=1.40.1",
    "pyarrow>=24.0.0",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
    "pytz>=2026.2",
    "tenacity>=9.1.4",
    "tqdm>=4.67.3",
    "websocket-client>=1.9.0",
    # epsilon_data research library + dashboard (Step H–J)
    "streamlit>=1.62.0",
    "plotly>=7.0.0",
    "matplotlib>=3.10.8",
    # scripts/fetch_data.py ONLY (no-rclone R2 download). The loader stays boto3-free — it reads
    # R2 via DuckDB httpfs, not boto3.
    "boto3>=1.35.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "pytest>=9.0.1",
]
