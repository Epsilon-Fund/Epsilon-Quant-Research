[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lemma-calibrate"
version = "0.1.0"
description = "Proper-score calibration diagnostics for probabilistic forecasts: Brier + Murphy decomposition, reliability diagrams with Wilson bands, ECE/MCE, Spiegelhalter's Z, isotonic/Platt recalibration, and market-odds edge."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Epsilon Research" }]
keywords = [
  "calibration", "brier-score", "murphy-decomposition", "reliability-diagram",
  "forecasting", "proper-scoring-rules", "recalibration", "prediction-markets",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]         # reliability_diagram PNG output
sklearn = ["scikit-learn>=1.3"]    # sklearn recalibration backends (numpy fallback built in)
dev = ["pytest>=8", "matplotlib>=3.7"]

[project.scripts]
lemma-calibrate = "lemma.calibrate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lemma"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "NOTICE"]
