[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rigorkit-changepoint"
version = "0.1.0"
description = "Causal, lookahead-free structural-break detection (CUSUM / Page-Hinkley / BOCPD) for regime gating, causal features, and purged-CV embargo."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Epsilon Research" }]
keywords = [
  "changepoint", "structural-break", "bocpd", "cusum", "page-hinkley",
  "regime-detection", "quant", "backtesting", "lookahead-free",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]          # CLI detect on parquet + append_changepoints
offline = ["ruptures>=1.1"]        # batch labelling/validation ONLY (never live)
dev = ["pytest>=8", "pyarrow>=14"]

[project.scripts]
rigorkit-changepoint = "rigorkit.changepoint.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rigorkit"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "NOTICE"]
